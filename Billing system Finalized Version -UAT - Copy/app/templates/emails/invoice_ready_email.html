<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice {{ invoice_number }} Ready</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 20px auto; padding: 24px; border: 1px solid #e5e7eb; border-radius: 8px; }
        .details { width: 100%; border-collapse: collapse; margin: 18px 0; }
        .details td { padding: 8px; border-bottom: 1px solid #eee; }
        .details td:first-child { font-weight: bold; width: 35%; }
        .button { display: inline-block; margin: 10px 8px 0 0; padding: 10px 16px; color: #fff; background: #1e3a5f; text-decoration: none; border-radius: 5px; }
        .amount { font-weight: bold; color: #198754; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Invoice ready</h2>
        <p>Hello {{ user.first_name }} {{ user.last_name }},</p>
        <p>Your service invoice has been generated.</p>
        <table class="details">
            <tr><td>Invoice number</td><td>{{ invoice_number }}</td></tr>
            <tr><td>Company</td><td>{{ company_name }}</td></tr>
            <tr><td>Generated</td><td>{{ generated_date }}</td></tr>
            <tr><td>Total</td><td class="amount">Rs {{ "%.2f"|format(total_amount) }}</td></tr>
        </table>
        <a class="button" href="{{ invoice_url }}">Open your dashboard</a>
        <a class="button" href="{{ download_url }}">Download invoice PDF</a>
    </div>
</body>
</html>
