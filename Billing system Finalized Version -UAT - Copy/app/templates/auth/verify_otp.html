<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - Invoice System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy-deep: #0A2540;
            --navy-mid: #1E3A5F;
            --navy-light: #2C5282;
            --gradient-start: #0A2540;
            --gradient-end: #1E3A5F;
        }
        
        body {
            background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
            overflow: hidden;
        }
        
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .otp-card {
            max-width: 460px;
            width: 100%;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            background: white;
            overflow: hidden;
            position: relative;
            z-index: 1;
            animation: slideUp 0.5s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .card-header {
            background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
            color: white;
            padding: 2rem;
            text-align: center;
            border-bottom: none;
        }
        
        .card-header h3 {
            margin: 0;
            font-weight: 700;
            font-size: 1.75rem;
            letter-spacing: -0.5px;
        }
        
        .card-header p {
            margin-top: 0.5rem;
            opacity: 0.9;
            font-size: 0.9rem;
        }
        
        .card-body {
            padding: 2rem;
        }
        
        .form-label {
            font-weight: 600;
            color: var(--navy-deep);
            margin-bottom: 0.5rem;
        }
        
        .form-control {
            border-radius: 14px;
            border: 1px solid #E2E8F0;
            padding: 0.75rem 1rem;
            transition: all 0.2s;
            font-size: 1rem;
            text-align: center;
            letter-spacing: 4px;
            font-size: 1.25rem;
            font-weight: 600;
        }
        
        .form-control:focus {
            border-color: var(--navy-mid);
            box-shadow: 0 0 0 3px rgba(30, 58, 95, 0.1);
            outline: none;
        }
        
        .btn-verify {
            background: linear-gradient(135deg, #059669 0%, #10B981 100%);
            border: none;
            padding: 0.85rem;
            font-weight: 600;
            border-radius: 40px;
            transition: all 0.3s;
            font-size: 1rem;
        }
        
        .btn-verify:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(5, 150, 105, 0.3);
        }
        
        .resend-link {
            font-size: 0.85rem;
            cursor: pointer;
            color: var(--navy-mid);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .resend-link:hover {
            text-decoration: underline;
            color: var(--navy-light);
        }
        
        .alert {
            border-radius: 16px;
            border-left: 4px solid;
        }
        
        .brand-icon {
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
        }
        
        .email-badge {
            background: #F1F5F9;
            padding: 8px 16px;
            border-radius: 40px;
            display: inline-block;
            font-size: 0.85rem;
            color: var(--navy-deep);
        }
        
        .otp-input-group {
            position: relative;
        }
        
        .otp-input-group .bi {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94A3B8;
            z-index: 10;
        }
        
        .otp-input-group input {
            padding-left: 45px;
        }
    </style>
</head>
<body>
    <div class="otp-card">
        <div class="card-header">
            <div class="brand-icon">
                <i class="bi bi-shield-lock fs-1"></i>
            </div>
            <h3>Verify OTP</h3>
            <p>One‑Time Passcode</p>
        </div>
        <div class="card-body">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                            <i class="bi bi-info-circle me-2"></i>{{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            
            <div class="text-center mb-4">
                <span class="email-badge">
                    <i class="bi bi-envelope me-1"></i> {{ email }}
                </span>
                <p class="text-muted mt-3 small">We sent a 6‑digit verification code to your email</p>
            </div>
            
            <form method="POST" id="otpForm">
                <div class="mb-4 otp-input-group">
                    <i class="bi bi-key"></i>
                    <input type="text" class="form-control" id="otp" name="otp" required 
                           placeholder="000000" maxlength="6" autofocus
                           oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                </div>
                <button type="submit" class="btn btn-success w-100 btn-verify" id="submitBtn">
                    <i class="bi bi-check-circle me-2"></i>Verify & Login
                </button>
            </form>
            <div class="text-center mt-4">
                <a href="{{ url_for('auth.login') }}" class="text-decoration-none me-3">
                    <i class="bi bi-arrow-left me-1"></i> Different email
                </a>
                <a href="#" id="resendOtpLink" class="resend-link">
                    <i class="bi bi-arrow-repeat me-1"></i> Resend OTP
                </a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        let submitting = false;
        const form = document.getElementById('otpForm');
        const submitBtn = document.getElementById('submitBtn');
        const resendLink = document.getElementById('resendOtpLink');
        
        form.addEventListener('submit', function(e) {
            const otp = document.getElementById('otp').value;
            if (otp.length !== 6) {
                e.preventDefault();
                Swal.fire({
                    icon: 'warning',
                    title: 'Invalid OTP',
                    text: 'Please enter the 6-digit verification code',
                    confirmButtonColor: '#1E3A5F'
                });
                return false;
            }
            if (submitting) {
                e.preventDefault();
                return false;
            }
            submitting = true;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="bi bi-hourglass-split me-2"></i>Verifying...';
        });
        
        if (resendLink) {
            resendLink.addEventListener('click', async function(e) {
                e.preventDefault();
                if (resendLink.classList.contains('disabled')) return;
                
                const email = '{{ email }}';
                const originalText = resendLink.innerHTML;
                
                resendLink.innerHTML = '<i class="bi bi-hourglass-split me-1"></i> Sending...';
                resendLink.classList.add('disabled');
                resendLink.style.opacity = '0.6';
                resendLink.style.pointerEvents = 'none';
                
                try {
                    const response = await fetch('/resend-otp', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: 'email=' + encodeURIComponent(email)
                    });
                    
                    if (response.ok) {
                        Swal.fire({
                            icon: 'success',
                            title: 'OTP Resent',
                            text: 'Please check your email for the new verification code',
                            confirmButtonColor: '#1E3A5F',
                            timer: 3000
                        });
                        submitting = false;
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<i class="bi bi-check-circle me-2"></i>Verify & Login';
                        document.getElementById('otp').value = '';
                    } else {
                        Swal.fire({
                            icon: 'error',
                            title: 'Failed',
                            text: 'Could not resend OTP. Please try again.',
                            confirmButtonColor: '#DC2626'
                        });
                    }
                } catch (error) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Network Error',
                        text: 'Please check your connection and try again.',
                        confirmButtonColor: '#DC2626'
                    });
                } finally {
                    setTimeout(() => {
                        resendLink.innerHTML = originalText;
                        resendLink.classList.remove('disabled');
                        resendLink.style.opacity = '';
                        resendLink.style.pointerEvents = '';
                    }, 2000);
                }
            });
        }
    </script>
</body>
</html>
